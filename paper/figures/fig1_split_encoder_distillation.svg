<svg role="img" aria-labelledby="swanada-fig1-title swanada-fig1-desc" viewBox="0 0 960 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <title id="swanada-fig1-title">Swanada Split-Encoder Decomposition and Sub-30 MB Cross-Capacity Distillation</title>
  <desc id="swanada-fig1-desc">Blueprint diagram showing cross-capacity distillation of the 177.4 MiB 17-layer Studio Conformer-Large into the 25.35 MiB 14-layer Mobile Conformer-Small with dynamic relative positional encoding, MatMul QInt8 pointwise convolutions, post-quantization QInt8 head calibration, and runtime protobuf exposure of layer_norm_84 driving 12 hot-swappable 515 KiB CTC heads.</desc>

  <defs>
    <style>
      text { user-select: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 2. Zone Containers -->
  <rect x="24" y="48" width="248" height="312" rx="8" fill="rgba(0,0,0,0.015)" stroke="#000000" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="38" y="40" width="204" height="16" rx="4" fill="#ffffff"/>
  <text x="140" y="52" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.11em">CROSS-CAPACITY DISTILLATION</text>

  <rect x="296" y="48" width="368" height="312" rx="8" fill="rgba(0,0,0,0.02)" stroke="#000000" stroke-width="1.2"/>
  <rect x="312" y="40" width="236" height="16" rx="4" fill="#ffffff"/>
  <text x="430" y="52" fill="#000000" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.11em">SUB-30 MB SPLIT-ENCODER CORE</text>

  <rect x="688" y="48" width="248" height="312" rx="8" fill="rgba(0,0,0,0.015)" stroke="#000000" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="704" y="40" width="204" height="16" rx="4" fill="#ffffff"/>
  <text x="806" y="52" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.11em">MODULAR 12-SCRIPT DECODING</text>

  <!-- 3. Orthogonal Connectors -->
  <!-- C1: Studio Teacher -> Distillation Engine -->
  <line x1="148" y1="168" x2="148" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="156" y="196" width="88" height="16" rx="4" fill="#ffffff"/>
  <text x="200" y="208" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SVD 512-&gt;256</text>

  <!-- C2: Distillation -> Mobile Conformer-Small (upper port y=268 -> y=128) -->
  <path d="M 248,268 H 276 Q 284,268 284,260 V 136 Q 284,128 292,128 H 316" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- C3: Studio Teacher -> Protobuf Tail Patcher (dashed Studio path along y=70 above N3 -> top of N5) -->
  <path d="M 248,104 H 260 Q 268,104 268,96 V 78 Q 268,70 276,70 H 570 Q 578,70 578,78 V 164" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- C4: Mobile Conformer-Small -> QInt8 Head Calibration -->
  <line x1="392" y1="168" x2="392" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="400" y="196" width="68" height="16" rx="4" fill="#ffffff"/>
  <text x="434" y="208" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">QINT8 H_S</text>

  <!-- C5: Mobile Conformer-Small -> Protobuf Tail Patcher -->
  <path d="M 468,136 H 480 Q 488,136 488,144 V 196 Q 488,204 496,204 H 508" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- C6: Protobuf Tail Patcher -> Hot-Swap CTC Heads -->
  <path d="M 648,196 H 664 Q 672,196 672,188 V 128 Q 672,120 680,120 H 712" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- C7: QInt8 Head Calibration -> Hot-Swap CTC Heads (calibrated 515 KiB weights) -->
  <path d="M 468,288 H 674 Q 682,288 682,280 V 160 Q 682,152 690,152 H 712" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- C8: Hot-Swap CTC Heads -> Native Script & IAST Decoder -->
  <line x1="812" y1="168" x2="812" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="820" y="196" width="84" height="16" rx="4" fill="#ffffff"/>
  <text x="862" y="208" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">[T&apos;, 257] LOGIT</text>

  <!-- 4. Node Boxes -->
  <!-- N1: Studio Conformer-Large -->
  <rect x="48" y="88" width="200" height="80" rx="6" fill="rgba(0,0,0,0.03)" stroke="#000000" stroke-width="1"/>
  <rect x="56" y="96" width="60" height="16" rx="4" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="86" y="108" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TEACHER</text>
  <text x="148" y="132" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Studio Conformer-L</text>
  <text x="148" y="152" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">177.4 MiB • 17L d=512 QInt8</text>

  <!-- N2: 4-Loss Distillation (FOCAL INVERTED) -->
  <rect x="48" y="240" width="200" height="80" rx="6" fill="#000000" stroke="#000000" stroke-width="1.2"/>
  <rect x="56" y="248" width="60" height="16" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.8"/>
  <text x="86" y="260" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DISTILL</text>
  <text x="148" y="284" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4-Loss Alignment</text>
  <text x="148" y="304" fill="#cccccc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Cos + MSE + KL(1.5) + CTC</text>

  <!-- N3: Mobile Conformer-Small -->
  <rect x="316" y="88" width="152" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="324" y="96" width="56" height="16" rx="4" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="352" y="108" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STUDENT</text>
  <text x="392" y="132" fill="#000000" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mobile Conformer-S</text>
  <text x="392" y="152" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">25.4 MiB • DynPE + MatMul</text>

  <!-- N4: Post-Quantization Head Calibration -->
  <rect x="316" y="240" width="152" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="324" y="248" width="64" height="16" rx="4" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="356" y="260" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CALIBRATE</text>
  <text x="392" y="284" fill="#000000" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QInt8 Head Fit</text>
  <text x="392" y="304" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Absorbs Int8 Drift • 12x</text>

  <!-- N5: Protobuf Tail Patcher -->
  <rect x="508" y="164" width="140" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="516" y="172" width="56" height="16" rx="4" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="544" y="184" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SURGERY</text>
  <text x="578" y="208" fill="#000000" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Protobuf Splitter</text>
  <text x="578" y="228" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;2ms • layer_norm_84</text>

  <!-- N6: Hot-Swappable Linear CTC Head -->
  <rect x="712" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="720" y="96" width="60" height="16" rx="4" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="750" y="108" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">12 HEADS</text>
  <text x="812" y="132" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">515 KiB Linear Heads</text>
  <text x="812" y="152" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">257x512 • &lt;20ms Hot-Swap</text>

  <!-- N7: Pan-Indic & IAST Decoder -->
  <rect x="712" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="720" y="248" width="60" height="16" rx="4" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="750" y="260" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DECODER</text>
  <text x="812" y="284" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CTC + Roman IAST</text>
  <text x="812" y="304" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">12 Scripts • &lt;1e-5 Parity</text>

  <!-- 5. Bottom Legend Strip -->
  <line x1="24" y1="384" x2="936" y2="384" stroke="rgba(0,0,0,0.16)" stroke-width="0.8"/>
  <text x="24" y="408" fill="#444444" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LEGEND</text>

  <rect x="96" y="396" width="16" height="16" rx="4" fill="#000000"/>
  <text x="120" y="408" fill="#000000" font-size="8" font-family="'Geist Mono', monospace">STATIONARY-HEAD DISTILLATION</text>

  <line x1="324" y1="404" x2="356" y2="404" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="364" y="408" fill="#000000" font-size="8" font-family="'Geist Mono', monospace">MOBILE 25.4 MIB STREAM</text>

  <line x1="548" y1="404" x2="580" y2="404" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="588" y="408" fill="#000000" font-size="8" font-family="'Geist Mono', monospace">STUDIO TIER / CALIBRATION WEIGHTS</text>
</svg>